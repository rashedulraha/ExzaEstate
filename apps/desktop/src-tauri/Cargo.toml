[package]
name = "exzaestate-desktop"
version = "0.1.0"
description = "ExzaEstate Enterprise ERP Desktop"
authors = ["ExzaEstate Team"]
edition = "2021"

[lib]
name = "exzaestate_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
libc = "=0.2.189"
sha2 = "=0.10.9"
hex = "=0.4.3"
base64 = "=0.22.1"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["alloc"] }
