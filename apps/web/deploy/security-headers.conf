# ==============================================================================
# ExzaEstate Web SPA Production Security Headers
# References: architecture.md §12.7, §17; security.md §10, §15, §16
# ==============================================================================

# Content Security Policy (Strict, zero unsafe-inline/unsafe-eval for scripts, frame-ancestors none)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;" always;

# HTTP Strict Transport Security (HSTS 2 years + subdomains + preload)
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking Protection (DENY in addition to frame-ancestors 'none')
add_header X-Frame-Options "DENY" always;

# Strict Referrer Privacy
add_header Referrer-Policy "no-referrer" always;

# Feature and Hardware Permissions Lock-down
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), screen-wake-lock=(), accelerometer=(), gyroscope=(), magnetometer=(), display-capture=()" always;

# Cross-Origin Isolation Policies
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Disable legacy buggy XSS auditors
add_header X-XSS-Protection "0" always;
