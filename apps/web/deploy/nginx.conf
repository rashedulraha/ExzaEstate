# ==============================================================================
# ExzaEstate Web SPA Production Nginx Configuration
# Compliant with architecture.md §12.7, §17 and security.md §15, §16
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Disable server version disclosure banner
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        font/woff
        font/woff2
        image/bmp
        image/svg+xml
        text/cache-manifest
        text/calendar
        text/css
        text/javascript
        text/markdown
        text/plain
        text/xml
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # Global security headers
    include /etc/nginx/conf.d/security-headers.conf;

    # SPA Fallback Routing
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # SPA Entry Point: Never cache index.html so users receive latest bundle hashes
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # Content-Hashed Static Assets: Cache immutably for 1 year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # Favicon and basic site metadata
    location ~* \.(ico|png|svg|webmanifest)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # Optional Reverse Proxy to Same-Site Backend API if co-located
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Deny access to hidden / dot files (except .well-known)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
