version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Asia/Dhaka'
    labels:
      - 'dependencies'
    open-pull-requests-limit: 10

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Asia/Dhaka'
    labels:
      - 'ci-cd'
    open-pull-requests-limit: 5

  - package-ecosystem: 'docker'
    directory: '/docker'
    schedule:
      interval: 'monthly'
    labels:
      - 'docker'
